<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix It Up - Premium Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f111a;
            --bg-sidebar: #151824;
            --bg-card: #1e2235;
            --accent: #2ecc71;
            --text-main: #ffffff;
            --text-sub: #8b9bb4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; align-items: center; padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); }
        .profile-container { text-align: center; margin-bottom: 40px; position: relative; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background-color: #2a2f45; border: 3px solid #2a2f45; margin-bottom: 15px; object-fit: cover; }
        .status-dot { width: 14px; height: 14px; background-color: #e74c3c; border: 2px solid var(--bg-sidebar); border-radius: 50%; position: absolute; bottom: 40px; right: 10px; transition: background-color 0.3s; }
        .status-dot.online { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .username { font-size: 18px; font-weight: 600; color: var(--text-main); }
        .status-text { font-size: 12px; color: var(--text-sub); margin-top: 5px; }
        .menu-items { width: 100%; }
        .menu-item { width: 100%; padding: 12px 15px; border-radius: 8px; color: var(--text-sub); text-decoration: none; display: flex; align-items: center; gap: 15px; margin-bottom: 8px; transition: all 0.2s; font-weight: 500; }
        .menu-item.active, .menu-item:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
        .menu-item.active i { color: var(--accent); }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .header p { color: var(--text-sub); font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: var(--bg-card); border-radius: 16px; padding: 25px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.02); }
        .card-info h3 { font-size: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .card-info .value { font-size: 24px; font-weight: 700; }
        .card-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .card.money .card-icon { background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .card.money .value { color: #2ecc71; }
        .card.kms .card-icon { background-color: rgba(52, 152, 219, 0.1); color: #3498db; }
        .card.kms .value { color: #3498db; }
        .card.cars .card-icon { background-color: rgba(230, 126, 34, 0.1); color: #e67e22; }
        .card.cars .value { color: #e67e22; }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-container">
            <img id="player-avatar" class="avatar" src="https://images.rbxcdn.com/716ec89fae18378378411d31edc0a6b5.png" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
            <div id="username" class="username">Loading...</div>
            <div id="status-text" class="status-text">OFFLINE</div>
        </div>
        <div class="menu-items">
            <a href="#" class="menu-item active"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Fix It Up Status</h1>
            <p>อัปเดตล่าสุด: <span id="last-update">-</span></p>
        </div>

        <div class="stats-grid">
            <div class="card money">
                <div class="card-info">
                    <h3>Money</h3>
                    <div id="stat-money" class="value">€0</div>
                </div>
                <div class="card-icon"><i class="fa-solid fa-wallet"></i></div>
            </div>
            <div class="card kms">
                <div class="card-info">
                    <h3>Kilometers</h3>
                    <div id="stat-kms" class="value">0 km</div>
                </div>
                <div class="card-icon"><i class="fa-solid fa-road"></i></div>
            </div>
            <div class="card cars">
                <div class="card-info">
                    <h3>Cars Sold</h3>
                    <div id="stat-cars" class="value">0</div>
                </div>
                <div class="card-icon"><i class="fa-solid fa-car-side"></i></div>
            </div>
        </div>
    </div>

<script>
    // ดึงข้อมูลจากฐานข้อมูล Firebase ของคุณโดยตรง
    const firebaseURL = "https://fix-it-up-95c6b-default-rtdb.firebaseio.com/.json";
    let currentCachedUser = "";

    function updateDashboard() {
        fetch(firebaseURL)
        .then(res => res.json())
        .then(data => {
            if (!data) return;

            const username = Object.keys(data)[0];
            if (!username) return;

            const stats = data[username];

            document.getElementById("username").innerText = username;
            document.getElementById("stat-money").innerText = "€" + Number(stats.money || 0).toLocaleString();
            document.getElementById("stat-kms").innerText = Number(stats.kms || 0).toLocaleString() + " km";
            document.getElementById("stat-cars").innerText = Number(stats.carsSold || 0).toLocaleString() + " คัน";
            document.getElementById("last-update").innerText = stats.lastUpdate || "-";

            if (currentCachedUser !== username) {
                currentCachedUser = username;
                fetch(`https://users.roblox.com/v1/users/search?keyword=${username}&limit=1`)
                .then(r => r.json())
                .then(uData => {
                    if(uData.data && uData.data[0]) {
                        const userId = uData.data[0].id;
                        document.getElementById("player-avatar").src = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`;
                    }
                }).catch(() => {});
            }

            const timeNow = Math.floor(Date.now() / 1000);
            const dot = document.getElementById("status-dot");
            const txt = document.getElementById("status-text");

            if (stats.timestamp && (timeNow - stats.timestamp) <= 12) {
                dot.className = "status-dot online";
                txt.innerText = "ONLINE";
                txt.style.color = "#2ecc71";
            } else {
                dot.className = "status-dot";
                txt.innerText = "OFFLINE";
                txt.style.color = "#8b9bb4";
            }
        })
        .catch(err => console.error(err));
    }

    updateDashboard();
    setInterval(updateDashboard, 3000);
</script>
</body>
</html>
